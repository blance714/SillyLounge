name: Publish installable build

on:
  push:
    branches:
      - main

permissions:
  # Nothing is written back to *this* repo any more; the installable payload
  # goes to blance714/SillyLounge-dist over a scoped deploy key.
  contents: read

concurrency:
  group: publish-dist
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and build contract
        run: pnpm run verify

      - name: Read pinned SillyTavern host
        id: st-pin
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pin = JSON.parse(fs.readFileSync("test/e2e/st-version.json", "utf8"));
            process.stdout.write(`repository=${pin.repository}\ncommit=${pin.commit}\nversion=${pin.version}\n`);
          ' >> "$GITHUB_OUTPUT"

      - name: Check out pinned SillyTavern host
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.st-pin.outputs.repository }}
          ref: ${{ steps.st-pin.outputs.commit }}
          path: .test-host/SillyTavern
          persist-credentials: false

      - name: Install SillyTavern runtime dependencies
        working-directory: .test-host/SillyTavern
        run: npm ci --omit=dev

      - name: Install Playwright browsers
        # Both engines: the rails-width defect fixed in 55af8f1 was invisible to
        # Blink and plainly broken in Gecko, so layout gates that only ever ran
        # in Chromium were not gates at all.
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Assemble browser-test runtime
        run: pnpm run runtime

      - name: Verify the real SillyTavern UI (Chromium and Firefox)
        env:
          SILLYTAVERN_TEST_ROOT: ${{ github.workspace }}/.test-host/SillyTavern
        run: pnpm exec playwright test

      - name: Verify the chat-switch performance harness
        env:
          SILLYTAVERN_TEST_ROOT: ${{ github.workspace }}/.test-host/SillyTavern
        run: |
          node ./scripts/e2e/measure-chat-switch.mjs || {
            status=$?
            echo "::error::chat-switch harness failed; its JSON report (on success) and screenshots/SillyTavern logs (always) live under test-results/performance/ and are picked up by the browser-test evidence upload below"
            exit "$status"
          }

      - name: Verify the native-truncation guard acceptance
        env:
          SILLYTAVERN_TEST_ROOT: ${{ github.workspace }}/.test-host/SillyTavern
        run: |
          node ./scripts/e2e/verify-truncation-guard.mjs || {
            status=$?
            echo "::error::truncation-guard acceptance failed; its report lives under test-results/truncation-guard/ and is picked up by the browser-test evidence upload below"
            exit "$status"
          }

      - name: Verify the last-chat delete transaction
        env:
          SILLYTAVERN_TEST_ROOT: ${{ github.workspace }}/.test-host/SillyTavern
        run: |
          node ./scripts/e2e/verify-last-chat-delete.mjs || {
            status=$?
            echo "::error::last-chat-delete acceptance failed; its report lives under test-results/last-chat-delete/ and is picked up by the browser-test evidence upload below"
            exit "$status"
          }

      - name: Upload browser-test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: sillylounge-playwright-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Assemble validated runtime
        run: node ./scripts/runtime.mjs --target "$RUNNER_TEMP/SillyLounge-runtime"

      # Publishes into a separate repository, not a branch of this one.
      #
      # SillyTavern names the installed extension's directory after the *repo*
      # (`sanitize(path.basename(parsedUrl.pathname, '.git'))`, its
      # endpoints/extensions.js), and installs the default branch unless the
      # reader fills in the optional branch field — which almost no extension
      # requires, so almost nobody does. Publishing to a branch of the source
      # repo therefore forced a choice between "the install URL just works" and
      # "GitHub shows the source", and this repo had picked the former: its
      # default branch was the build output. Two repos give both.
      #
      # blance714/SillyLounge-dist must never be renamed. Its name *is* the
      # install directory name, so renaming it silently orphans every existing
      # install and changes EXTENSION_FOLDER in the e2e fixture.
      - name: Publish to the installable repository
        shell: bash
        env:
          DIST_PUBLISH_KEY: ${{ secrets.DIST_PUBLISH_KEY }}
          DIST_REPO: git@github.com:blance714/SillyLounge-dist.git
        run: |
          set -euo pipefail

          runtime_dir="$(readlink -f "$RUNNER_TEMP/SillyLounge-runtime")"
          payload_dir="$RUNNER_TEMP/SillyLounge-payload"
          publish_dir="$RUNNER_TEMP/SillyLounge-dist"

          mkdir -p "$payload_dir"
          rsync -a --delete "$runtime_dir/" "$payload_dir/"
          # Not this repo's README: that one is for people reading the source.
          # The installable repo's landing page is an install page.
          cp dist-README.md "$payload_dir/README.md"
          node ./scripts/check-runtime.mjs "$payload_dir"

          # A write deploy key scoped to the installable repo alone — not a PAT,
          # which would carry account-wide reach and an expiry date that turns
          # into a silently failing publish on some future afternoon.
          mkdir -p ~/.ssh
          printf '%s\n' "$DIST_PUBLISH_KEY" > ~/.ssh/dist_publish_key
          chmod 600 ~/.ssh/dist_publish_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/dist_publish_key -o IdentitiesOnly=yes"

          git clone "$DIST_REPO" "$publish_dir"
          rsync -a --delete --exclude=.git "$payload_dir/" "$publish_dir/"

          git -C "$publish_dir" add --all
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "Installable payload is unchanged."
            exit 0
          fi

          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" commit \
            -m "build: publish ${GITHUB_SHA::12}" \
            -m "Published from blance714/SillyLounge@${GITHUB_SHA}."
          git -C "$publish_dir" push origin HEAD:main
